name: Factory bridge checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/factory/**
      - factory-requests/**
      - .github/workflows/factory-bridge-check.yml
permissions:
  contents: read
jobs:
  generate-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/factory/job-action.mjs
      - name: Verify real generated ZIP and receipt
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const d = ".agent-work/factory-delivery/";
            const h = JSON.parse(fs.readFileSync(d+"handoff.json","utf8"));
            assert.equal(h.status,"starter_generated");
            assert.equal(h.publishing_authorized,false);
            assert.equal(h.editorial_review,"unreviewed");
            assert.ok(fs.statSync(d+"motion-job.zip").size>1000);
          '
